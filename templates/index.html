<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTalks — Rupiah Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <style>
        /* ── Page layout ─────────────────────────────────────── */
        main {
            min-height: calc(100vh - 56px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 24px 80px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .app-wrap {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ── App header ──────────────────────────────────────── */
        .app-header { display: flex; flex-direction: column; gap: 6px; }

        .app-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.4px;
            color: var(--fg-2);
            margin: 0;
        }

        /* ── Toggle button ───────────────────────────────────── */
        #toggle-btn {
            width: 100%;
            font-size: 2.2rem;
            font-weight: 700;
            padding: 28px;
            border-radius: var(--r-lg);
            letter-spacing: -0.5px;
        }

        #toggle-btn.btn-primary {
            background: #7c8ff0;
            box-shadow: 0 4px 24px rgba(124,143,240,0.45);
        }
        #toggle-btn.btn-primary:hover {
            background: #9aaaf5;
            box-shadow: 0 6px 32px rgba(124,143,240,0.55);
        }

        #toggle-btn.btn-secondary {
            background: #374151;
            color: #f9fafb;
            border-color: #6b7280;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        #toggle-btn.btn-secondary:hover {
            background: #4b5563;
            border-color: #9ca3af;
        }

        /* ── Video card ──────────────────────────────────────── */
        .video-card {
            background: var(--surface-1);
            border: 1px solid var(--hairline);
            border-radius: var(--r-xl);
            overflow: hidden;
            position: relative;
            aspect-ratio: 4/3;
            box-shadow: var(--shadow-inset);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ── Camera placeholder (shown before camera starts) ── */
        .camera-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            pointer-events: none;
        }

        .camera-placeholder svg {
            opacity: 0.18;
            width: 64px;
            height: 64px;
        }

        .camera-placeholder p {
            font-size: 14px;
            color: var(--fg-4);
            margin: 0;
            letter-spacing: 0;
        }

        /* ── CV bounding box ─────────────────────────────────── */
        .cv-box {
            position: absolute;
            border: 2px solid var(--accent);
            box-shadow: 0 0 0 1px rgba(94,106,210,0.25), 0 0 20px rgba(94,106,210,0.15);
            pointer-events: none;
            z-index: 10;
            display: none;
            border-radius: var(--r-xs);
            transition: all 100ms var(--ease);
        }

        /* ── Status line ─────────────────────────────────────── */
        #status {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--fg-3);
            padding: 8px 14px;
            background: var(--surface-1);
            border: 1px solid var(--hairline);
            border-radius: var(--r-md);
            box-shadow: var(--shadow-inset);
        }

        /* ── Result display (≈48pt — PRD WCAG requirement) ───── */
        #result-text {
            font-family: var(--font);
            font-size: 64px;
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -2px;
            color: var(--fg-3);
            padding: 28px 28px;
            background: var(--surface-1);
            border: 1px solid var(--hairline);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-inset);
            word-break: break-word;
            transition:
                color var(--duration) var(--ease),
                border-color var(--duration) var(--ease);
        }

        /* Blue = detected, Orange = not detected
           Both differ in hue AND brightness — safe for all color blind types.
           Symbols (✓ / ⚠) carry the meaning independently of color. */
        #result-text.valid {
            color: #60a5fa;
            border-color: rgba(96,165,250,0.3);
        }

        #result-text.invalid {
            color: #fb923c;
            border-color: rgba(251,146,60,0.3);
        }

        /* ── Responsive ──────────────────────────────────────── */
        @media (max-width: 480px) {
            .nav { padding: 0 16px; }
            main { padding: 32px 16px 64px; }
            #result-text { font-size: 48px; letter-spacing: -1.5px; padding: 20px; }
            .btn-xl { font-size: 1.2rem; padding: 12px 22px; }
        }
    </style>
</head>
<body>

<!-- ── Navigation ──────────────────────────────────────────────── -->
<nav class="nav">
    <div class="nav-left">
        <a href="{{ url_for('index') }}" class="nav-brand">
            <span class="nav-glyph">◆</span>
            MoneyTalks
        </a>
    </div>
    <div class="nav-right">
        <a href="{{ url_for('test_page') }}" class="btn btn-secondary" style="font-size:13px; padding:6px 12px;">Test Upload</a>
        <a href="{{ url_for('admin_login') }}" class="btn btn-outline"    style="font-size:13px; padding:6px 12px;">Admin</a>
    </div>
</nav>

<!-- ── Main ────────────────────────────────────────────────────── -->
<main>
    <div class="app-wrap">

        <div class="app-header">
            <span class="eyebrow">Computer Vision · IDR Detector</span>
            <p class="app-title">Arahkan uang kertas Rupiah ke kamera.</p>
        </div>

        <!-- Toggle button -->
        <button id="toggle-btn" class="btn btn-primary" aria-label="Mulai Deteksi Kamera">
            Mulai
        </button>

        <!-- Camera feed -->
        <div class="video-card">
            <video id="camera-stream" autoplay playsinline aria-hidden="true"></video>
            <div id="cv-box" class="cv-box"></div>

            <!-- Placeholder — hidden once camera starts -->
            <div id="camera-placeholder" class="camera-placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="#f7f8f8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
                <p>Tekan Mulai untuk mengaktifkan kamera</p>
            </div>
        </div>

        <!-- Status (polite ARIA live region for screen readers) -->
        <div id="status" role="status" aria-live="polite">Kamera siap digunakan.</div>

        <!-- Result (assertive ARIA live — announced immediately) -->
        <div id="result-text" aria-live="assertive">Belum Dideteksi</div>

    </div>
</main>

<span class="sr-only" id="sr-announce" aria-live="assertive"></span>

<script>
    const video      = document.getElementById("camera-stream");
    const toggleBtn  = document.getElementById("toggle-btn");
    const resultText = document.getElementById("result-text");
    const statusText = document.getElementById("status");

    let stream            = null;
    let detectionInterval = null;
    let lastDetectedLabel = "";
    let _ttsAudio         = null;
    let isRunning         = false;

    const placeholder = document.getElementById("camera-placeholder");

    toggleBtn.addEventListener("click", (e) => {
        e.stopPropagation(); // prevent double-fire with the document listener
        if (isRunning) stopCamera();
        else startCamera();
    });

    // Click anywhere outside the navbar to toggle
    document.addEventListener("click", (e) => {
        if (!document.querySelector(".nav").contains(e.target)) {
            if (isRunning) stopCamera();
            else startCamera();
        }
    });

    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            });
            video.srcObject = stream;
            placeholder.style.display = "none";
            isRunning = true;
            toggleBtn.innerText       = "Berhenti";
            toggleBtn.setAttribute("aria-label", "Hentikan Deteksi");
            toggleBtn.classList.remove("btn-primary");
            toggleBtn.classList.add("btn-secondary");
            statusText.innerText = "Kamera aktif. Sedang memproses gambar...";

            // PRD: capture frame every 1 second
            detectionInterval = setInterval(captureAndSendFrame, 1000);
            speakOut("Kamera aktif. Mengambil gambar.");
            lastDetectedLabel = "";
        } catch (err) {
            console.error("Camera access error:", err);
            statusText.innerText = "Gagal mengakses kamera. " + err.message;
            speakOut("Gagal mengakses kamera.");
        }
    }

    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }
        clearInterval(detectionInterval);
        isRunning = false;
        toggleBtn.innerText       = "Mulai";
        toggleBtn.setAttribute("aria-label", "Mulai Deteksi Kamera");
        toggleBtn.classList.remove("btn-secondary");
        toggleBtn.classList.add("btn-primary");
        statusText.innerText = "Kamera dinonaktifkan.";
        resultText.innerText = "Belum Dideteksi";
        resultText.className = "";
        resultText.removeAttribute("aria-label");
        document.getElementById("cv-box").style.display = "none";
        placeholder.style.display = "flex";
        speakOut("Kamera dimatikan.");
    }

    function speakOut(text) {
        if (window.speechSynthesis) {
            if (window.speechSynthesis.speaking) return;
            const utt = new SpeechSynthesisUtterance(text);
            utt.lang = "id-ID";
            utt.rate = 1.0;
            window.speechSynthesis.speak(utt);
        } else {
            // Fallback: gTTS server-side
            if (_ttsAudio && !_ttsAudio.paused) return;
            _ttsAudio = new Audio("/api/tts?text=" + encodeURIComponent(text));
            _ttsAudio.play().catch(() => {});
        }
    }

    async function captureAndSendFrame() {
        if (!video.videoWidth) return;

        const canvas = document.createElement("canvas");
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append("frame", blob, "frame.jpg");

            try {
                const response = await fetch("/api/detect", { method: "POST", body: formData });
                if (!response.ok) throw new Error("API error");

                const data = await response.json();
                const cvBox = document.getElementById("cv-box");

                // Draw bounding box
                if (data.box && data.box.length === 4 && data.box[2] > 0) {
                    cvBox.style.display = "block";
                    cvBox.style.left   = (data.box[0] * 100) + "%";
                    cvBox.style.top    = (data.box[1] * 100) + "%";
                    cvBox.style.width  = (data.box[2] * 100) + "%";
                    cvBox.style.height = (data.box[3] * 100) + "%";
                } else {
                    cvBox.style.display = "none";
                }

                if (data.valid) {
                    // ✓ symbol conveys success independent of color
                    resultText.innerText = "✓ " + data.message;
                    resultText.className = "valid";
                    resultText.setAttribute("aria-label", "Terdeteksi: " + data.message);
                    statusText.innerText = "Terdeteksi — confidence " + (data.confidence * 100).toFixed(1) + "%";

                    if (lastDetectedLabel !== data.message || !window.speechSynthesis?.speaking) {
                        speakOut(data.message);
                        lastDetectedLabel = data.message;
                    }
                } else {
                    // ⚠ symbol conveys warning independent of color
                    resultText.innerText = "⚠ " + data.message;
                    resultText.className = "invalid";
                    resultText.setAttribute("aria-label", "Tidak terdeteksi: " + data.message);
                    statusText.innerText = "Tidak terdeteksi.";
                    speakOut(data.message);
                    lastDetectedLabel = "";
                }
            } catch (e) {
                console.error("Inference error:", e);
            }
        }, "image/jpeg", 0.85);
    }
</script>

</body>
</html>
